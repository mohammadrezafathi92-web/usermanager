server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Found 2026-09-27: `proxy_set_header X-Real-IP $remote_addr;` below used
    # to mean, unconditionally, "whoever is DIRECTLY connected to nginx" -
    # which is the real client only when nothing else sits in front of this
    # container. Two supported setups in this project put something else
    # there instead: the bundled Caddy container (the `tls` compose profile,
    # caddy/entrypoint.sh - which already sets X-Real-IP correctly) and an
    # admin's own external reverse proxy on the same host (PANEL_WEB_BIND=
    # 127.0.0.1, see docker-compose.yml). In both cases $remote_addr was
    # THAT PROXY's own address, not the visitor's - so every real visitor
    # was seen by the backend as one shared IP, and ten unrelated
    # unauthenticated requests from any mix of them was enough to trip
    # services/ip_guard.py's auto-ban for that one shared address, taking
    # the whole panel offline for everyone at once (reported as "دسترسی این
    # آی‌پی به پنل مسدود شده است" appearing for every visitor simultaneously).
    #
    # ngx_http_realip_module fixes this at the source: when the peer nginx
    # is DIRECTLY connected to is one of the trusted ranges below, it
    # substitutes $remote_addr with the X-Real-IP that peer already sent
    # (Caddy, or the admin's own proxy) BEFORE the proxy_set_header line
    # below ever runs - so that line does not need to change at all. A
    # request arriving with NO trusted proxy in front (the default,
    # no-Caddy deployment) is completely unaffected: nginx IS the real
    # peer there, so $remote_addr is already the true client address.
    #
    # Deliberately trusts the whole loopback/private-network range, not one
    # specific container address - Docker assigns container IPs dynamically,
    # so pinning to one exact address breaks on every recreate. Nothing else
    # legitimately reaches this container from inside that private space.
    # Mirrors services/ip_guard.py's TRUSTED_PROXY_CIDRS on the backend side
    # exactly, so both layers trust the same boundary.
    set_real_ip_from 127.0.0.1;      # admin's own external reverse proxy (PANEL_WEB_BIND=127.0.0.1)
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;  # Docker's default bridge network range (covers the bundled Caddy container)
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Remote bot deploy (SSH install on a second server, incl. `curl
        # get.docker.com` + full `docker compose up --build` of the whole
        # backend image, not a slim one - see remote_deploy.py's docstring)
        # can legitimately take several minutes on a modest VPS. This must
        # stay ABOVE remote_deploy.py's own internal 600s per-step timeout
        # (so a genuine backend-side timeout there gets to return its own
        # proper error response first) and the frontend's axios timeout for
        # this call (client.js's deployRemoteBot) - otherwise nginx cuts the
        # connection with a bare 504 and the panel has nothing useful to
        # show but a generic "خطا در نصب ربات روی سرور دوم".
        proxy_read_timeout 660s;
        proxy_connect_timeout 660s;
        # nginx's default client_max_body_size is 1m, which silently rejects
        # (413, plain HTML body - no JSON "detail") any database-restore
        # upload larger than that once real usage_logs/connections data has
        # accumulated. The frontend then has nothing to show but its generic
        # "خطا در بازگردانی دیتابیس" fallback, hiding the real cause.
        client_max_body_size 200m;
    }

    # Hashed build output (index-a1b2c3.js and friends). The filename
    # changes whenever the contents do, so these are safe to keep forever -
    # a stale one is never REQUESTED, because nothing points at it.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # index.html must NEVER be cached.
        #
        # This is the whole reason panel updates kept "not appearing". It is
        # the only file with a fixed name, and it is what names the hashed
        # bundles above. Served with no cache headers at all, browsers fall
        # back to heuristic caching and reuse it without asking - so a
        # perfectly deployed update kept pointing at the previous build's
        # JavaScript, on a server that had already been updated. It looked
        # like the deploy had failed, twice, and both times it had not.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
