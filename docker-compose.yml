# Docker keeps EVERY line a container ever printed in an ever-growing
# json log file under /var/lib/docker/containers/ - with no limit by
# default. The backend prints a line per HTTP request plus RADIUS/poller
# activity, so on a busy panel that file quietly grows to gigabytes and
# fills the server's disk (exactly what happened, 2026-08-09). This anchor
# caps every service below at 3 rotated files x 20MB.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  backend:
    build: ./backend
    container_name: usermanager-backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    # NET_ADMIN + /dev/net/tun: the panel brings up its own WireGuard
    # interface INSIDE this container to reach Telegram (see
    # services/wg_tunnel.py). Kept here rather than in a separate container
    # on purpose - sharing a network namespace with a second container
    # would mean moving this one's published ports (8000, RADIUS) onto it,
    # which is a large change to a live panel for no gain. The interface
    # routes ONLY Telegram's ranges; the host's default route is untouched.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # NOTE: overriding `dns:` here was tried and reverted. Pointing the
    # container at 1.1.1.1/8.8.8.8 only works while the tunnel carries
    # traffic to them; the moment it does not, NOTHING in the panel
    # resolves - including the nodes' own hostnames. That turns a bot
    # outage into a panel-wide one, which is the opposite of the rule this
    # tunnel was built under: a broken tunnel must cost the bot and nothing
    # else. If the tunnel is ever proven stable on a node, add it back
    # deliberately rather than as part of setup.
    # IPv6 off inside this container. The forged answer observed in practice
    # was an AAAA record, and a host with no working IPv6 route then fails
    # with "Network is unreachable" instead of falling back to IPv4. With v6
    # disabled, glibc stops offering AAAA results at all and the working IPv4
    # path is used.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    volumes:
      - ./backend/data:/app/data
      # Let the backend change the panel's own web port with no SSH/password
      # prompt at all (تنظیمات > پورت پنل وب - see services/local_deploy.py):
      # talk to the HOST's docker daemon over its socket, and bind-mount this
      # project directory at the SAME absolute path the daemon sees on the
      # real host filesystem (must match HOST_PROJECT_DIR below) so relative
      # paths in this very docker-compose.yml still resolve correctly when
      # the daemon acts on them.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the SAME absolute path the host uses, which is what
      # makes it safe for this container to drive `docker compose` on
      # the host daemon. install.sh writes HOST_PROJECT_DIR into the
      # .env next to this file; /root/usermanager is only the fallback
      # for installs that predate that (see services/local_deploy.py's
      # verify_host_path for what goes wrong when they disagree).
      - .:${HOST_PROJECT_DIR:-/root/usermanager}
    environment:
      # DATABASE_URL deliberately NOT set here (unlike before this comment
      # existed) - it now comes from backend/.env (via env_file: above) so
      # install.sh's database-engine choice (SQLite vs MySQL/MariaDB) is
      # actually respected. `environment:` entries in a compose file take
      # precedence over `env_file:` ones for the same variable, so setting
      # DATABASE_URL here would silently override whatever backend/.env
      # says, no matter what the admin picked at install time.
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-/root/usermanager}
    ports:
      - "8000:8000"
      - "1812:1812/udp"
      - "1813:1813/udp"

  # Optional MariaDB service - only started when the "mariadb" profile is
  # active (install.sh writes COMPOSE_PROFILES=mariadb into a repo-root
  # .env when the admin picks MySQL/MariaDB at install time; docker compose
  # reads that file automatically for compose-file variable substitution -
  # a separate mechanism from backend/.env's env_file: above, which only
  # feeds the backend CONTAINER's own environment). Not wired into
  # backend's depends_on on purpose - a non-profiled service can't depend
  # on a profile-gated one without forcing the profile to always resolve;
  # backend's `restart: unless-stopped` already covers the brief window
  # where MariaDB is still starting up (SQLAlchemy's pool_pre_ping, see
  # database.py, then makes the first successful connection retry-safe too).
  mariadb:
    image: mariadb:11
    container_name: usermanager-mariadb
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - mariadb
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE:-usermanager}
      - MARIADB_USER=${MARIADB_USER:-usermanager}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-changeme}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-changeme}
    volumes:
      - ./backend/data/mariadb:/var/lib/mysql
    ports:
      - "3306:3306"

  frontend:
    build: ./frontend
    container_name: usermanager-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "80:80"
