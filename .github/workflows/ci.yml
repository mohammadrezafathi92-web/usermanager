name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # A real MariaDB for the durable-provisioning schema tests
    # (tests/test_provisioning_schema_*.py): compiled DDL alone cannot show
    # that MariaDB enforces the CHECK/UNIQUE/FOREIGN KEY constraints or that
    # the startup inspector reads them back correctly. Same major version as
    # docker-compose.yml's optional mariadb service. The credentials below
    # exist only inside this throwaway CI container - they are not secrets
    # and are used nowhere else.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-local-only
          MARIADB_DATABASE: um_ci_scratch
          MARIADB_USER: um_ci
          MARIADB_PASSWORD: ci-local-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      # Those tests treat a missing URL as a FAILURE when CI is set (GitHub
      # sets CI=true), so the MariaDB half can never be skipped silently.
      # The tests never use an existing database: tests/_mariadb_scratch.py
      # CREATEs its own randomly named um_test_run_* database for each test
      # and DROPs only that. Hence an account that may create databases -
      # root of this throwaway container. um_ci_scratch is only the database
      # the connection is opened on; nothing is created or dropped in it.
      MARIADB_TEST_URL: mysql+pymysql://root:ci-root-local-only@127.0.0.1:3306/um_ci_scratch?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run isolated backend checks
        run: python tests/run_all.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
